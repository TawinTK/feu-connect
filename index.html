<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบเช็คชื่อเข้าชมรม</title>
  
  <!-- โหลด Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    // 🚀 1. สคริปต์ช่วยเด้งไป Chrome/Safari อัตโนมัติเมื่อเข้าผ่าน LINE / Facebook
    (function checkInAppBrowser() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isLine = ua.indexOf("LINE") > -1;
      var isFb = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      
      if (isLine || isFb) {
        var currentUrl = window.location.href;
        if (/Android/i.test(ua)) {
          var chromeUrl = currentUrl.replace(/^https?:\/\//, '');
          window.location.href = "intent://" + chromeUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } else if (/iPhone|iPad|iPod/i.test(ua) && isLine) {
          var connector = currentUrl.indexOf('?') > -1 ? '&' : '?';
          window.location.href = currentUrl + connector + "openExternalBrowser=1";
        }
      }
    })();
  </script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #000000, #001a4d);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #loginView {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 90%;
      max-width: 400px;
    }

    /* กล่องปุ่มล็อกอิน */
    #buttonDiv {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      min-height: 40px; /* ป้องกันปุ่มยุบตัว */
    }

    #dashboardView {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .Stamp-container { display: flex; gap: 12px; margin-bottom: 40px; }
    .stamp { width: 55px; height: 55px; object-fit: contain; filter: grayscale(100%); opacity: 0.5; transition: filter 1s, opacity 1s; }
    .stamp.active { filter: grayscale(0%); opacity: 1; }
    #text1 { font-size: 18px; margin-bottom: 25px; min-height: 25px; }
    #button { width: 130px; cursor: pointer; transition: transform 0.3s; }
    #button.holding { transform: scale(1.15); }
    #button.disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }
    .status-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; background: rgba(255,255,255,0.8); color: #333; }
  </style>
</head>
<body>

  <div id="loginView">
    <h2>เข้าสู่ระบบชมรม</h2>
    <p>ลงชื่อเข้าใช้ด้วยอีเมลสถาบัน<br>(@feu.edu หรือ @feu.ac.th)</p>
    <div id="buttonDiv"></div>
    <div id="statusBox" class="status-box"></div>
  </div>

  <div id="dashboardView">
    <h2 id="userName" style="margin-bottom: 30px;">ยินดีต้อนรับ</h2>
    
    <div class="Stamp-container">
      <img src="image/Stamp.png" class="stamp" id="stamp-0" alt="Day 1">
      <img src="image/Stamp.png" class="stamp" id="stamp-1" alt="Day 2">
      <img src="image/Stamp.png" class="stamp" id="stamp-2" alt="Day 3">
      <img src="image/Stamp.png" class="stamp" id="stamp-3" alt="Day 4">
      <img src="image/Stamp.png" class="stamp" id="stamp-4" alt="Day 5">
    </div>

    <p id="text1">กดปุ่มไอคอนค้างไว้เพื่อเช็คชื่อ</p>
    <img src="image/buttonicon.png" id="button" alt="Hold to Check In">
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxzfo9-MsOHweR6XHbmmhJ_Qtp6ZNAAOAERTCgarBijc0FYp7zMMmUoNmF7EFB-RO1c2g/exec";
    const CLIENT_ID = "131534824591-34tjld2b96cm3i85t26e3egqpp50370a.apps.googleusercontent.com";

    let currentEmail = "";
let currentTodayIndex = -1;

window.onload = function () {
  if (window.google && google.accounts) {
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: false,
      use_fedcm_for_prompt: false // ✨ ป้องกันไม่ให้ Google เปลี่ยนหน้าไป /gsi/transform
    });

    google.accounts.id.renderButton(
      document.getElementById("buttonDiv"),
      { 
        type: "standard",
        theme: "filled_blue", 
        size: "large", 
        shape: "rectangular",
        text: "signin_with"
      }
    );
  } else {
    showLoginStatus("ไม่สามารถโหลดระบบล็อกอินได้ กรุณารีเฟรชหน้าจอ");
  }
};

function handleCredentialResponse(response) {
  showLoginStatus("กำลังตรวจสอบบัญชีและประวัติการเช็คชื่อ...");
  
  try {
    currentEmail = parseJwt(response.credential).email;
  } catch (e) {
    showLoginStatus("❌ ไม่สามารถดึงข้อมูลอีเมลได้");
    return;
  }

  callGASAPI("checkUser", { email: currentEmail }, function(res) {
    if (res.success && res.isMember) {
      document.getElementById('loginView').style.display = "none";
      document.getElementById('dashboardView').style.display = "flex";
      document.getElementById('userName').innerText = (res.name || currentEmail);

      // บันทึกตำแหน่งวันของวันนี้
      if (res.todayIndex !== undefined) {
        currentTodayIndex = res.todayIndex;
      }

      // แสดงสีแสตมป์ตามประวัติจริงใน Excel
      if (res.attendanceHistory && Array.isArray(res.attendanceHistory)) {
        res.attendanceHistory.forEach((status, index) => {
          const stamp = document.getElementById(`stamp-${index}`);
          if (stamp) {
            const cleanStatus = (status || "").toString().trim();
            if (cleanStatus === "มา") {
              stamp.classList.add("active");
            } else {
              stamp.classList.remove("active");
            }
          }
        });
      }

      if (!res.hasClubToday) {
        lockButton("❌ วันนี้ไม่มีกำหนดการชมรม");
      } else if (res.alreadyCheckedIn) {
        showSuccess(res.todayDateStr);
      }
    } else {
      showLoginStatus("❌ " + res.message);
    }
  });
}

// ✨ ฟังก์ชันถอดรหัส JWT Token แบบปลอดภัย ไม่เด้งข้อผิดพลาด
function parseJwt(token) {
  var base64Url = token.split('.')[1];
  var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}

    // --- Hold to Confirm Logic ---
    let holdTimer;
    let isHolding = false;
    let isCheckedIn = false;
    const btn = document.getElementById('button');
    const txt = document.getElementById('text1');

    function startHold(e) {
      if (isCheckedIn || btn.classList.contains('disabled')) return;
      e.preventDefault();
      isHolding = true;
      btn.classList.add('holding');
      txt.innerText = "กำลังเช็คชื่อ... กรุณากดค้างไว้";

      holdTimer = setTimeout(() => {
        if (isHolding) submitAttendance();
      }, 1500);
    }

    function cancelHold(e) {
      if (isCheckedIn || btn.classList.contains('disabled')) return;
      isHolding = false;
      clearTimeout(holdTimer);
      btn.classList.remove('holding');
      if (txt.innerText === "กำลังเช็คชื่อ... กรุณากดค้างไว้") {
        txt.innerText = "กดปุ่มไอคอนค้างไว้เพื่อเช็คชื่อ";
      }
    }

    btn.addEventListener('mousedown', startHold);
    btn.addEventListener('touchstart', startHold, {passive: false});
    btn.addEventListener('mouseup', cancelHold);
    btn.addEventListener('mouseleave', cancelHold);
    btn.addEventListener('touchend', cancelHold);

    function submitAttendance() {
      clearTimeout(holdTimer);
      btn.classList.remove('holding');
      txt.innerText = "กำลังส่งข้อมูลบันทึกเวลา...";

      callGASAPI("markAttendance", { email: currentEmail }, function(res) {
        if (res.success) {
          var targetIndex = (res.todayIndex !== undefined && res.todayIndex !== -1) 
                            ? res.todayIndex 
                            : currentTodayIndex;

          if (targetIndex !== -1) {
            const targetStamp = document.getElementById(`stamp-${targetIndex}`);
            if (targetStamp) {
              targetStamp.classList.add('active');
            }
          }
          showSuccess(res.todayDateStr);
        } else {
          txt.innerText = "❌ " + res.message;
        }
      });
    }

    function showSuccess(dateStr) {
      isCheckedIn = true;
      const d = dateStr || new Date().toLocaleDateString('th-TH');
      txt.innerText = `✅ คุณได้เช็คชื่อวันนี้แล้ว (${d})`;
      btn.classList.add('disabled');
    }

    function lockButton(msg) {
      isCheckedIn = true;
      txt.innerText = msg;
      btn.classList.add('disabled');
    }

    function callGASAPI(action, payload, callback) {
      payload.action = action;
      fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => callback(data))
        .catch(err => showLoginStatus("เกิดข้อผิดพลาดในการเชื่อมต่อ"));
    }

    function showLoginStatus(text) {
      const box = document.getElementById("statusBox");
      box.style.display = "block";
      box.innerText = text;
    }

    function parseJwt (token) {
  try {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    
    // เติม Padding (=) ให้ Base64 สมบูรณ์ป้องกัน Error
    while (base64.length % 4) {
      base64 += '=';
    }
    
    // ถอดรหัสรองรับอักขระ UTF-8 ทุกภาษา
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));

    return JSON.parse(jsonPayload);
  } catch (e) {
    console.error("JWT Parse Error:", e);
    return {};
  }
}
  </script>
</body>
</html>
