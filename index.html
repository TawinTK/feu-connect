<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คชื่อเข้าชมรม</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
    #buttonDiv { display: flex; justify-content: center; margin-top: 15px; }
    .status-box { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
    .info { background-color: #e3f2fd; color: #0d47a1; }
    .success { background-color: #e8f5e9; color: #1b5e20; }
    .error { background-color: #ffebee; color: #b71c1c; }
    .btn-confirm { background-color: #2e7d32; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ระบบเช็คชื่อเข้าชมรม</h2>
    <p>ลงชื่อเข้าใช้ด้วยอีเมลสถาบัน<br>(@feu.edu หรือ @feu.ac.th)</p>

    <div id="buttonDiv"></div>
    <div id="statusBox" class="status-box"></div>
    <button id="checkInBtn" class="btn-confirm" onclick="submitAttendance()">ยืนยันลงชื่อเข้าชมรม</button>
  </div>

  <script>
    // 🔗 1. วาง Web App URL ที่ได้จาก Google Apps Script
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwd4cSERyJjNdbG3A-6vnrq0C5iyWOr0MBdIc8aC0cK2XZNUeE6Fcy_HpVR0OSDXoV5pg/exec";
    
    // 🔑 2. วาง Client ID จาก Google Cloud Console
    const CLIENT_ID = "131534824591-34tjld2b96cm3i85t26e3egqpp50370a.apps.googleusercontent.com";

    let currentEmail = "";

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        { theme: "outline", size: "large", text: "signin_with", shape: "rectangular" }
      );
    }

    function handleCredentialResponse(response) {
      showStatus("กำลังตรวจสอบข้อมูล...", "info");
      const responsePayload = parseJwt(response.credential);
      currentEmail = responsePayload.email;

      // ส่งคำสั่งไปเช็คอีเมลกับ Google Apps Script API
      callGASAPI("checkUser", { email: currentEmail }, function(res) {
        if (!res.success) {
          showStatus("❌ " + res.message, "error");
        } else if (!res.isMember) {
          showStatus("❌ " + res.message + "<br>(" + res.email + ")", "error");
        } else if (!res.hasClubToday) {
          showStatus("📅 " + res.message, "info");
        } else if (res.alreadyCheckedIn) {
          showStatus("✅ คุณได้เช็คชื่อเข้าชมรมวันนี้เรียบร้อยแล้ว", "success");
        } else {
          showStatus("พบบัญชี: " + res.email + "<br>พร้อมสำหรับการเช็คชื่อ", "info");
          document.getElementById("checkInBtn").style.display = "block";
        }
      });
    }

    function submitAttendance() {
      showStatus("กำลังบันทึกการเช็คชื่อ...", "info");
      document.getElementById("checkInBtn").style.display = "none";

      callGASAPI("markAttendance", { email: currentEmail }, function(res) {
        if (res.success) {
          showStatus("🎉 " + res.message, "success");
        } else {
          showStatus("❌ " + res.message, "error");
          document.getElementById("checkInBtn").style.display = "block";
        }
      });
    }

    // ฟังก์ชันยิง API ไปหา Google Apps Script
    function callGASAPI(action, payload, callback) {
      payload.action = action;
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => callback(data))
      .catch(err => showStatus("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err, "error"));
    }

    function showStatus(text, type) {
      const box = document.getElementById("statusBox");
      box.className = "status-box " + type;
      box.innerHTML = text;
      box.style.display = "block";
    }

    function parseJwt (token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }
  </script>
</body>
</html>
